name: Build Lexos APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Source checks
        run: npm run test:logic
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Lexos-Poker-Analyzer-v0.5.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lexos-Poker-Analyzer-v0.5.1
          path: dist/Lexos-Poker-Analyzer-v0.5.1.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.5.1 --cleanup-tag -y || true
          gh release create v0.5.1 dist/Lexos-Poker-Analyzer-v0.5.1.apk --title "Lexos Poker Analyzer V0.5.1" --notes "APK Android de test. Caméra + saisie de contrôle + moteur exact post-flop."
